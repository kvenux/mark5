<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-label="Mark 5 vs MarkText vs VS Code 性能对比">
  <defs>
    <style>
      .bg { fill: #FAF9F6; stroke: #E7E5E4; stroke-width: 1; }
      .title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1C1917; }
      .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #44403C; }
      .label-m5 { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14532D; }
      .val { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #C2410C; }
      .val-m5 { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #15803D; }
      .divider { stroke: #E7E5E4; stroke-width: 1; }
      .track { fill: #F1EFEA; }
      .bar-m5 { fill: #16A34A; }
      .bar-other { fill: #F97316; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="489" rx="14" class="bg" />

  <!-- Panel 1: 软件体积 -->
  <text x="32" y="38" class="title">软件体积</text>

  <text x="32" y="74" class="label-m5">Mark 5</text>
  <rect x="140" y="59" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="59" width="10" height="22" rx="5" class="bar-m5" />
  <text x="162" y="75" class="val-m5">7 MB</text>

  <text x="32" y="108" class="label">MarkText</text>
  <rect x="140" y="93" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="93" width="224" height="22" rx="6" class="bar-other" />
  <text x="376" y="109" class="val">383 MB</text>

  <text x="32" y="142" class="label">VS Code</text>
  <rect x="140" y="127" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="127" width="590" height="22" rx="6" class="bar-other" />
  <text x="742" y="143" class="val">1,007 MB</text>

  <line x1="32" y1="170" x2="848" y2="170" class="divider" />

  <!-- Panel 2: 单开内存 -->
  <text x="32" y="202" class="title">单开内存</text>

  <text x="32" y="238" class="label-m5">Mark 5</text>
  <rect x="140" y="223" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="223" width="241" height="22" rx="6" class="bar-m5" />
  <text x="393" y="239" class="val-m5">156 MB</text>

  <text x="32" y="272" class="label">MarkText</text>
  <rect x="140" y="257" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="257" width="523" height="22" rx="6" class="bar-other" />
  <text x="675" y="273" class="val">338 MB</text>

  <text x="32" y="306" class="label">VS Code</text>
  <rect x="140" y="291" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="291" width="590" height="22" rx="6" class="bar-other" />
  <text x="742" y="307" class="val">381 MB</text>

  <line x1="32" y1="334" x2="848" y2="334" class="divider" />

  <!-- Panel 3: 双开内存 -->
  <text x="32" y="366" class="title">双开内存</text>

  <text x="32" y="402" class="label-m5">Mark 5</text>
  <rect x="140" y="387" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="387" width="85" height="22" rx="6" class="bar-m5" />
  <text x="237" y="403" class="val-m5">197 MB</text>

  <text x="32" y="436" class="label">MarkText</text>
  <rect x="140" y="421" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="421" width="234" height="22" rx="6" class="bar-other" />
  <text x="386" y="437" class="val">545 MB</text>

  <text x="32" y="470" class="label">VS Code</text>
  <rect x="140" y="455" width="590" height="22" rx="6" class="track" />
  <rect x="140" y="455" width="590" height="22" rx="6" class="bar-other" />
  <text x="742" y="471" class="val">1,375 MB</text>
</svg>
