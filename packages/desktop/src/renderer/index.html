<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark 5</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #141416;
        color: #e4e2dc;
      }
    </style>
    <script>
      try {
        var raw = localStorage.getItem('mark5_settings');
        var parsed = raw ? JSON.parse(raw) : null;
        var theme =
          parsed && (parsed.theme === 'dark' || parsed.theme === 'light' || parsed.theme === 'warm')
            ? parsed.theme
            : 'warm';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
