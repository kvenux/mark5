[package]
name = "mark5"
version = "0.1.0"
description = "Mark 5 — Ultra-lightweight AI-Native Markdown Editor"
authors = ["Mark 5"]
edition = "2021"

[lib]
name = "mark5_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
axum = "0.8"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
